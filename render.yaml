services:
  - type: web
    name: resumecraft-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --no-input && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && gunicorn resumecraft.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false

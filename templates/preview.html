{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="preview-container py-4">
    <div class="container">
        <!-- Top Toolbar for Preview & Export -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white rounded-3 border shadow-sm preview-actions-bar no-print">
            <div class="d-flex align-items-center gap-3">
                <a id="btnBackToEditor" href="{% url 'editor' %}" class="btn btn-sm btn-outline-custom">
                    <i class="bi bi-arrow-left"></i> Back to Editor
                </a>
                <span class="small text-muted d-none d-md-inline">
                    <i class="bi bi-info-circle text-primary"></i> <strong>Clean PDF tip:</strong> Uncheck <em>Headers and footers</em> under More settings in print dialog
                </span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-sm btn-outline-custom" onclick="downloadPdf()">
                    <i class="bi bi-printer"></i> Print Preview
                </button>
                <button type="button" class="btn btn-sm btn-primary-custom" onclick="downloadPdf()">
                    <i class="bi bi-download"></i> Download A4 PDF
                </button>
            </div>
        </div>

        <!-- Standalone Preview Sheet Container -->
        <div id="standalonePreviewContainer" class="preview-sheet-container">
            <div id="resumeSheet" class="resume-sheet template-classic fs-normal spacing-normal">
                <!-- Rendered by renderLivePreview() in editor.js -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{% if server_resume_json %}
<script id="serverResumeData" type="application/json">
{{ server_resume_json|safe }}
</script>
{% endif %}
<script>
window.isUserAuthenticated = {{ user.is_authenticated|yesno:"true,false" }};
</script>
<script src="{% static 'js/editor.js' %}"></script>
{% endblock %}
